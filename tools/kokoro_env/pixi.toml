# The Kokoro voice env (Python 3.12; the render env's 3.13 cannot load kokoro). Install once:
#   mkdir -p ~/kokoro_env && cp tools/kokoro_env/pixi.toml ~/kokoro_env/ && pixi install --manifest-path ~/kokoro_env/pixi.toml
[workspace]
name = "kokoro_env"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
ffmpeg = "*"
pip = "*"

[pypi-dependencies]
kokoro = ">=0.9.4"
soundfile = "*"
misaki = { version = "*", extras = ["en"] }
