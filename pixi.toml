[workspace]
authors = ["DanielChahine004 <danielchahine001@gmail.com>"]
channels = ["conda-forge"]
name = "slab_crlb_narrated"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"
# Linux, macOS (Apple silicon) and Windows (from Git Bash). Chatterbox needs CUDA torch, so it is installed on Linux
# and Windows only; the default voice, Kokoro, has its own env (tools/kokoro_env) and runs on any CPU. manim's
# LaTeX comes from TinyTeX (tools/platform.sh installs it). Shared by every video folder here; each folder's
# render.sh drives its build, and voices.py is the shared narrator.

[activation.env]
PYTHONUTF8 = "1"   # Windows' Python reads and writes cp1252 otherwise; every script, plan and narration is UTF-8
KMP_DUPLICATE_LIB_OK = "TRUE"   # Windows: torch and Whisper's ctranslate2 each bring an OpenMP runtime; the second aborts

[dependencies]
python = "3.13.*"  # chatterbox-tts pins numpy<2 below 3.13, which manim 0.19 cannot use
manim = ">=0.19,<0.20"
ffmpeg = "*"
pip = "*"
tomlkit = "<0.14"  # chatterbox pins gradio 6.8, which caps tomlkit and pillow
pillow = "<13"
setuptools = "<81"  # resemble-perth (chatterbox watermarker) still imports pkg_resources
hatchling = ">=1.27"  # builds paperstore: an isolated build resolves from the cu124 index, whose packaging (<=24.1) no hatchling >=1.27 accepts

[pypi-dependencies]
manim-voiceover = "*"
soundfile = "*"
faster-whisper = "*"
num2words = "*"
audioop-lts = "*"   # pydub (manim-voiceover) needs audioop, gone from Python 3.13; Chatterbox brought it on Linux, nothing on a Mac
paperstore = { git = "https://github.com/DanielChahine004/paperstore" }   # vlint plan: cite quotes found on their page (paperstore.pdf.find)

# CUDA torch: Chatterbox runs on an NVIDIA GPU (CUDA 12), so not on a Mac
[target.linux-64.pypi-dependencies]
chatterbox-tts = "==0.1.7"

[target.win-64.pypi-dependencies]
chatterbox-tts = "==0.1.7"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]
no-build-isolation = ["paperstore"]   # built with the hatchling above, not an isolated one from the torch index
